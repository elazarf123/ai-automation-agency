<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Make.com scenario diagram: enrichment, analysis, CRM sync, alerting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F0FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="stroke" x1="200" y1="80" x2="1200" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C3CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="shadow" x="-50" y="-50" width="1500" height="920" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.12"/>
    </filter>

    <filter id="soft" x="-20" y="-20" width="440" height="220" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.10"/>
    </filter>

    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1400" height="820" rx="28" fill="url(#bg)"/>
  <rect x="36" y="36" width="1328" height="748" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="36" y="36" width="1328" height="748" rx="22" stroke="#E5E7EB"/>

  <!-- Top bar -->
  <rect x="36" y="36" width="1328" height="70" rx="22" fill="#0B0B17"/>
  <circle cx="76" cy="71" r="8" fill="#EF4444"/>
  <circle cx="104" cy="71" r="8" fill="#F59E0B"/>
  <circle cx="132" cy="71" r="8" fill="#22C55E"/>
  <text x="170" y="78" class="ui" font-size="18" fill="#E5E7EB" font-weight="700">Make.com Scenario — Lead Qualification (Snapshot)</text>
  <text x="1260" y="78" class="mono" font-size="14" fill="#9CA3AF">v1.0</text>

  <!-- Sidebar -->
  <rect x="36" y="106" width="260" height="678" fill="#F9FAFB"/>
  <rect x="36" y="106" width="260" height="678" stroke="#E5E7EB"/>

  <text x="70" y="155" class="ui" font-size="12" fill="#6B7280" font-weight="700" letter-spacing="0.12em">MODULES</text>
  <!-- Sidebar items -->
  <g class="ui" font-size="14" fill="#111827">
    <rect x="60" y="175" width="212" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="82" y="203" font-weight="700">01  Enrichment</text>

    <rect x="60" y="229" width="212" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="82" y="257" font-weight="700">02  Analysis</text>

    <rect x="60" y="283" width="212" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="82" y="311" font-weight="700">03  CRM Sync</text>

    <rect x="60" y="337" width="212" height="44" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="82" y="365" font-weight="700">04  Alerting</text>
  </g>

  <text x="70" y="430" class="ui" font-size="12" fill="#6B7280" font-weight="700" letter-spacing="0.12em">STATUS</text>
  <g class="ui" font-size="13" fill="#111827">
    <rect x="60" y="450" width="212" height="90" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="82" y="482" fill="#6B7280">Last run</text>
    <text x="82" y="505" font-weight="800">Successful</text>
    <circle cx="232" cy="498" r="7" fill="#22C55E"/>
    <text x="82" y="532" fill="#6B7280">Avg duration</text>
    <text x="180" y="532" font-weight="700">00:41</text>
  </g>

  <!-- Main workspace -->
  <rect x="296" y="106" width="1068" height="678" fill="#FFFFFF"/>
  <rect x="296" y="106" width="1068" height="678" stroke="#E5E7EB"/>

  <text x="330" y="155" class="ui" font-size="20" fill="#111827" font-weight="800">End-to-End Logic Flow</text>
  <text x="330" y="182" class="ui" font-size="14" fill="#6B7280">Enrich → Score → Sync → Notify (Grade A only)</text>

  <!-- Flow line -->
  <path d="M420 460 C560 300, 740 300, 880 460 C1020 620, 1180 620, 1250 460" stroke="url(#stroke)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <path d="M420 460 C560 300, 740 300, 880 460 C1020 620, 1180 620, 1250 460" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round"/>

  <!-- 01 Enrichment -->
  <g filter="url(#soft)">
    <rect x="340" y="380" width="220" height="160" rx="18" fill="#F5F0FF" stroke="#E9D5FF"/>
    <rect x="360" y="402" width="46" height="46" rx="14" fill="#6C3CFF"/>
    <text x="383" y="432" class="ui" font-size="16" fill="#FFFFFF" font-weight="900" text-anchor="middle">01</text>
    <text x="420" y="432" class="ui" font-size="16" fill="#111827" font-weight="900">Enrichment</text>
    <text x="360" y="472" class="ui" font-size="13" fill="#374151">Clearbit API</text>
    <text x="360" y="495" class="ui" font-size="12" fill="#6B7280">20+ data points per lead</text>
    <rect x="360" y="510" width="168" height="10" rx="5" fill="#DDD6FE"/>
    <rect x="360" y="510" width="118" height="10" rx="5" fill="#6C3CFF" opacity="0.8"/>
  </g>

  <!-- 02 Analysis -->
  <g filter="url(#soft)">
    <rect x="600" y="250" width="220" height="160" rx="18" fill="#ECFEFF" stroke="#A5F3FC"/>
    <rect x="620" y="272" width="46" height="46" rx="14" fill="#0EA5E9"/>
    <text x="643" y="302" class="ui" font-size="16" fill="#FFFFFF" font-weight="900" text-anchor="middle">02</text>
    <text x="680" y="302" class="ui" font-size="16" fill="#111827" font-weight="900">Analysis</text>
    <text x="620" y="342" class="ui" font-size="13" fill="#374151">Claude AI</text>
    <text x="620" y="365" class="ui" font-size="12" fill="#6B7280">6-dimensional ICP scoring</text>
    <rect x="620" y="380" width="168" height="10" rx="5" fill="#CFFAFE"/>
    <rect x="620" y="380" width="144" height="10" rx="5" fill="#0EA5E9" opacity="0.85"/>
  </g>

  <!-- 03 CRM Sync -->
  <g filter="url(#soft)">
    <rect x="860" y="380" width="220" height="160" rx="18" fill="#F0FDF4" stroke="#BBF7D0"/>
    <rect x="880" y="402" width="46" height="46" rx="14" fill="#16A34A"/>
    <text x="903" y="432" class="ui" font-size="16" fill="#FFFFFF" font-weight="900" text-anchor="middle">03</text>
    <text x="940" y="432" class="ui" font-size="16" fill="#111827" font-weight="900">CRM Sync</text>
    <text x="880" y="472" class="ui" font-size="13" fill="#374151">HubSpot</text>
    <text x="880" y="495" class="ui" font-size="12" fill="#6B7280">Create record + priority flags</text>
    <rect x="880" y="510" width="168" height="10" rx="5" fill="#DCFCE7"/>
    <rect x="880" y="510" width="132" height="10" rx="5" fill="#16A34A" opacity="0.85"/>
  </g>

  <!-- 04 Alerting -->
  <g filter="url(#soft)">
    <rect x="1120" y="520" width="220" height="160" rx="18" fill="#FFF7ED" stroke="#FED7AA"/>
    <rect x="1140" y="542" width="46" height="46" rx="14" fill="#F97316"/>
    <text x="1163" y="572" class="ui" font-size="16" fill="#FFFFFF" font-weight="900" text-anchor="middle">04</text>
    <text x="1200" y="572" class="ui" font-size="16" fill="#111827" font-weight="900">Alerting</text>
    <text x="1140" y="612" class="ui" font-size="13" fill="#374151">Slack</text>
    <text x="1140" y="635" class="ui" font-size="12" fill="#6B7280">Notify only Grade A leads</text>
    <rect x="1140" y="650" width="168" height="10" rx="5" fill="#FFEDD5"/>
    <rect x="1140" y="650" width="154" height="10" rx="5" fill="#F97316" opacity="0.9"/>
  </g>

  <!-- Bottom label -->
  <text x="330" y="760" class="ui" font-size="12" fill="#6B7280">End-to-End Logic Flow (illustrative Make.com scenario snapshot)</text>
</svg>
