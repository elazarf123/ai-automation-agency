<svg width="1400" height="820" viewBox="0 0 1400 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Make.com scenario diagram: support chatbot with Shopify lookup, Zendesk escalation, Slack alerts, and Klaviyo follow-ups">
  <defs>
