      <stop stop-color="#FFF1F2"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="stroke" x1="220" y1="140" x2="1240" y2="700" gradientUnits="userSpaceOnUse">
